name: Build and Release

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  webui-quality:
    name: WebUI release checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Scan Git-visible source for credentials
        run: python3 packages/web-host/docker/releaseChecks.py
      - name: Validate the publication workflow
        run: python3 packages/web-host/docker/releaseChecks.py workflow
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint -- --quiet
      - run: bun run format:check
      - run: bunx tsc --noEmit
      - run: bunx tsc --noEmit -p packages/web-host/tsconfig.json
      - run: bun run i18n:types
      - run: node scripts/check-i18n.js
      - run: bun run test
      - run: python3 -m unittest discover -s packages/web-host/docker -p 'test*.py'

  webui-image:
    name: Test Linux image and publish GHCR
    if: github.ref == 'refs/heads/main'
    needs: webui-quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    concurrency:
      group: aionui-edu-webui-publication
      cancel-in-progress: true
    env:
      IMAGE: ghcr.io/sunnypsk/aionui_edu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up cached image builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the exact revision for Unraid
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            RELEASE_SEQUENCE=${{ github.run_number }}.${{ github.run_attempt }}
          cache-from: type=gha,scope=webui-linux-amd64
          cache-to: type=gha,mode=max,scope=webui-linux-amd64,ignore-error=true
      - name: Verify TUN routing and proxy failure behavior
        run: |
          test -c /dev/net/tun || sudo install -d /dev/net
          test -c /dev/net/tun || sudo mknod /dev/net/tun c 10 200
          PROFILE=packages/web-host/src/runtime/browser/security/apparmor.profile
          sudo apparmor_parser -r "$PROFILE"
          trap 'sudo apparmor_parser -R "$PROFILE"' EXIT
          python3 packages/web-host/docker/checkContainer.py \
            "$IMAGE:sha-$GITHUB_SHA-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
      - name: Show sandbox AppArmor denials on failure
        if: failure()
        run: sudo dmesg | grep 'apparmor="DENIED".*profile="aionui-sandbox"' | tail -40 || true
      - name: Publish only the tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/aionui-edu-registry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          install -d -m 700 "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1; rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          VERSION="$IMAGE:sha-$GITHUB_SHA-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          docker push "$VERSION"
          docker tag "$VERSION" "$IMAGE:stable"
          docker push "$IMAGE:stable"
          printf 'Published commit `%s` as `%s` and `stable`.\n' "$GITHUB_SHA" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
