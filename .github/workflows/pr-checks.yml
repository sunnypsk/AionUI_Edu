name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webui-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  webui-quality:
    name: WebUI checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Scan Git-visible source for credentials
        run: python3 packages/web-host/docker/releaseChecks.py
      - name: Validate the publication workflow
        run: python3 packages/web-host/docker/releaseChecks.py workflow
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint -- --quiet
      - run: bun run format:check
      - run: bunx tsc --noEmit
      - run: bunx tsc --noEmit -p packages/web-host/tsconfig.json
      - run: bun run i18n:types
      - run: node scripts/check-i18n.js
      - run: bun run test
      - run: python3 -m unittest discover -s packages/web-host/docker -p 'test*.py'
      - run: bun run build
